name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (MAJOR.MINOR.PATCH, must match src/workflow_policy/__init__.py)
        required: true

permissions: {}

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
      - run: python -m pytest

      - name: Tag and publish the release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be MAJOR.MINOR.PATCH"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/master ] || { echo "::error::release from master only"; exit 1; }
          grep -qx "__version__ = \"$VERSION\"" src/workflow_policy/__init__.py \
            || { echo "::error::src/workflow_policy/__init__.py is not at $VERSION"; exit 1; }

          major="v${VERSION%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git tag -fa "$major" -m "$major -> v$VERSION"
          git push origin "refs/tags/v$VERSION"
          git push --force origin "refs/tags/$major"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
