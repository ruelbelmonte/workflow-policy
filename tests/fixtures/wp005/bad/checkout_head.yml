name: pr-target
on:
  pull_request_target:
    types: [opened, synchronize]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }} # expect: WP005
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }} # expect: WP005
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/pull/${{ github.event.number }}/merge # expect: WP005
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }} # expect: WP005
      - run: |
          echo preparing
          gh pr checkout ${{ github.event.number }} # expect: WP005
          git fetch origin pull/${{ github.event.number }}/head # expect: WP005
      - run: make test
